<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shipped default social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;background:#C6F432;color:#1A1615;font-family:Archivo,Arial,sans-serif}
.card{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.wordmark{font-size:158px;line-height:.9;font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.tagline{font-size:48px;font-style:italic;font-weight:500;border-top:4px solid #1A1615;padding-top:28px}
</style>
</head>
<body><div class="card"><div class="wordmark">Shipped</div><div class="tagline">In the wild, and mapped as it moves.</div></div></body>
</html>
