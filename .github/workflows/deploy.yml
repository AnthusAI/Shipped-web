# Merge to main deploys: CI runs here (this repository is public, so Actions minutes are free);
# a green push to main starts the Amplify job for that exact commit through GitHub OIDC.
# No AWS keys are stored: the role trusts repo:AnthusAI/Shipped-web:ref:refs/heads/main only and may only
# start and read jobs on this app's main branch. Amplify's own auto-build is off on main.
# Defined by the Papyrus app shell (docs/site-hosting.md, "Deploy on merge to main").
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # amplify_outputs.json is generated per deployment and git-ignored; the typecheck only needs
      # the module to resolve, so an empty stub stands in. No secrets.
      - run: echo '{}' > amplify_outputs.json
      - run: npx papyrus-app sync
      - run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-publication.txt
      - run: python -m unittest discover -s tests
      - run: pip install behave
      - run: behave features

  current-main:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      is-main-head: ${{ steps.compare.outputs.is-main-head }}
    steps:
      - id: compare
        run: |
          main_head="$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)"
          if [ "$main_head" = "${{ github.sha }}" ]; then
            echo "is-main-head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main-head=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: ${{ github.sha }} is no longer the head of main ($main_head)."
          fi

  deploy:
    needs: [ci, current-main]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.current-main.outputs.is-main-head == 'true'
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: dkycd9pntgo6d
      role-to-assume: arn:aws:iam::712236451410:role/shipped-github-deploy
